name: Build offline ZAIF extension
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned JS dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate source
        run: npm test
      - name: Bundle Whisper and model for offline use
        run: npm run setup
      - name: Validate locally packaged assets
        run: npm run verify:runtime
      # The Actions artifact itself downloads as ZIP. Upload raw extension files,
      # not another ZIP, so Windows only needs to extract once.
      - name: Verify extension root and bundled Whisper assets
        run: |
          test -f manifest.json
          test -f src/dashboard.html
          test -f lib/whisper-worker.mjs
          test -d lib/models/Xenova/whisper-tiny.en
          test -d lib/ort
      - name: Upload single-extract Chrome extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: zaif-arc-fizu-offline
          path: |
            manifest.json
            src/
            assets/
            lib/
          if-no-files-found: error
          retention-days: 30
